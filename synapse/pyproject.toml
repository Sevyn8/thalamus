[project]
# Distribution is `thalamus-synapse`; the MODULE is `synapse`. The split is
# deliberate: `synapse` alone collides with the well-known Matrix homeserver on
# PyPI, and while a workspace member would win resolution, the ambiguity is free
# to remove. The module name stays `synapse` so the import-linter contracts read
# `synapse.resolvers` rather than a prefixed variant.
name = "thalamus-synapse"
version = "0.0.0"
description = "Synapse — the Thalamus analytics + actions plane. A PEER of DIS, not part of it: it reads canonical read-only and (later) emits actions. Today: three resolvers (current_state, daily_series, last_sale_at), the shared D33 correction-collapse, the capability/signal/analysis contracts, and a data-driven registry where a caller declares what it needs — thresholds and policy included — and gets one of three honest answers about whether this tenant can supply it."
requires-python = ">=3.12"
dependencies = [
  # Canonical ROW SHAPES (Pydantic, not an ORM — dis-canonical says so itself:
  # "SQL conversion is the consumer's DB layer"). Synapse validates every row it
  # reads through these models, which is what makes a canonical schema change fail
  # LOUDLY on the first row instead of returning something plausible for months.
  "dis-canonical",
  # The two-GUC RLS session discipline + the wrong-database / bypassing-role guard.
  # Reused rather than reimplemented ON PURPOSE: duplicating a safety-critical
  # session dance across two planes is the same mistake as the duplicated Pub/Sub
  # poll loop, which is already a HIGH ledger item in this repo. The line that
  # matters is LIBRARY vs DEPLOYABLE SERVICE — depending on dis-rls is fine;
  # depending on a service would not be.
  "dis-rls",
  # UUIDv7 identifiers ONLY (dis_core.ids.new_uuid7). Already present transitively via dis-rls;
  # declared directly because synapse.orchestrator imports it, and an import that relies on
  # somebody else's dependency breaks the day that dependency is pruned. uuid4 is banned
  # project-wide and synapse.core mints nothing, so the ids have to come from here.
  "dis-core",
  # Statement construction only. sqlalchemy.table()/column() lightweight constructs
  # name the table in ONE module (synapse/resolvers/); there is no ORM model here.
  "sqlalchemy[asyncio]>=2.0.36",
  "pydantic>=2.9",
  # THE MIGRATION ENTRYPOINT, and it is a runtime dependency rather than a dev one ON PURPOSE.
  #
  # Synapse's chain has no way to reach staging: no job, no script, no Makefile target, and how
  # 0001-0003 were applied is recorded nowhere in this repository. migrate-synapse fixes that by
  # MIRRORING migrate-cm — the same image as the workload, with `command = ["alembic"]`
  # overriding the entrypoint.
  #
  # ONE IMAGE, NOT TWO, which is migrate-cm's own argument (D6: "a second pin would let the
  # migration run a different build"). A migration must run the code it ships with; a separately
  # pinned migration image can silently sit a revision behind the service it migrates for.
  #
  # THE IMAGE ALREADY CARRIES THE FILES — synapse/Dockerfile does `COPY synapse /synapse`, so
  # alembic.ini, alembic/ and schemas/ are all present. Only the CLI was missing:
  # `uv sync --no-dev --package thalamus-synapse` installs this package's closure, and alembic
  # lives in the ithina-dis ROOT project's dependencies, which that closure excludes. Verified
  # with `uv tree --package thalamus-synapse --no-dev` before and after this line.
  "alembic>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.pytest.ini_options]
# THE SUITE MUST RUN STANDALONE. Before this section existed there was no pytest config here
# at all, so `asyncio_mode` and the `integration` marker came only from dis/pyproject.toml and
# the Makefile's `-c` was load-bearing rather than a convenience. Measured cost of its absence:
# `pytest tests/unit` from this directory gave 12 failed / 91 passed — every async test, because
# the coroutines were never awaited — and the failures read as assertion errors rather than as
# "no asyncio plugin configured", so the natural response was to distrust the tests.
#
# BOTH INVOCATION PATHS STILL WORK. `make test` passes `-c ../dis/pyproject.toml`, and an
# explicit -c wins outright: pytest loads that file as THE config and never merges this one. So
# the Makefile path is byte-identical to before, and this section governs only direct
# invocation from synapse/.
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: needs a live canonical (SYNAPSE_READER_URL); see tests/integration/conftest.py",
]
