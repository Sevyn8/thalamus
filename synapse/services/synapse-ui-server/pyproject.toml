[project]
name = "synapse-ui-server"
version = "0.0.0"
description = "Synapse's backend-for-frontend. Serves the SUPERADMIN console in cm-frontend: fleet, one tenant, runs, alerts, capabilities and analyses. PLATFORM-only. Reads as synapse_reader; writes exactly two tables through two narrow roles, synapse.action_events as synapse_lifecycle (5d) and synapse.provision as synapse_provisioner (5e). Never synapse_writer, which is the orchestrator's."
requires-python = ">=3.12"
dependencies = [
  # The registry, the declarations and the resolvers. THE REASON THIS SERVICE
  # EXISTS AT ALL: E1 and E2 read registered_ids(), declared_analysis_ids() and
  # Threshold.stands_in_for, which are Python object state rather than rows. No
  # TypeScript route handler can reach them, and reimplementing them in TS would
  # be a second source of truth for what Synapse can do.
  "thalamus-synapse",
  # The two-GUC session discipline plus the wrong-database / bypassing-role
  # guard. The fleet read is the one query in Synapse that crosses tenants and it
  # runs under rls_platform_session(None) — see-all reads, writes NOTHING.
  "dis-rls",
  # Structured logging that emits `severity` (dis_core renames levelname), so a
  # log-based alert can match. Same convention as the orchestrator since 6b.
  "dis-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  # RS256/JWKS verification of real Auth0 tokens. There is no dev-stub mode here:
  # dis-ui-server carries one for historical reasons and it is a second code path
  # through the only thing standing between a caller and every tenant's data.
  "pyjwt[crypto]>=2.8",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  # THE PROVISIONING GATE'S ONE OUTBOUND CALL (5e). Customer Master owns the
  # permission model, so provisioning asks CM's /me/can-do rather than defining
  # a Synapse-local answer. Async because this sits on a request path: a
  # blocking client here would hold the event loop for the whole round trip.
  # Already in dis/uv.lock as a dis root dependency, so this pins no new version.
  "httpx>=0.27",
  # THE PUBLISHER, and it is declared HERE rather than on thalamus-axon deliberately. Axon holds
  # the envelope and a Publisher Protocol with no Pub/Sub import, so a library consumer that does
  # not publish does not grow a gRPC stack. Same split, same reason, as dis-ui-server.
  "google-cloud-pubsub>=2.23",
  # THE DELIVERY PLANE. This service is an Axon PRODUCER: the enable route
  # hands the provisioning event to Axon after recording it, and Axon carries it to the on-call
  # inbox and writes its own ledger row.
  #
  # A LIBRARY DEPENDENCY, NOT A SERVICE ONE, and the distinction is the same one thalamus-synapse
  # already draws: importing axon is fine, and it stays fine only while axon has no server of its
  # own. When the queue lands, this dependency becomes a publish and the import goes away.
  "thalamus-axon",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_ui_server"]
