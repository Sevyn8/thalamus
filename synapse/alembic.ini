# Synapse's OWN alembic chain. See alembic/env.py for why it is separate from DIS's, and for
# why the version table is named rather than defaulted.
#
# The URL is intentionally blank: env.py resolves SYNAPSE_ADMIN_URL from the environment. A URL
# here would be a second place to point the chain at the wrong database.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
