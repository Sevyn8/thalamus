# Secret-scanning configuration for the mandatory CI gate (.github/workflows/ci.yml).
#
# The gate is BLOCKING: any finding outside this allowlist fails the pull request.
# That is only defensible because every pre-existing finding was triaged one by
# one rather than silenced in bulk. Each entry below records what the match
# actually is and why it is not a credential.
#
# A NEW secret cannot hide behind these entries. The paths listed are files whose
# only matches are public identifiers, fabricated test strings, or prose; the one
# genuinely key-shaped artefact (a throwaway RSA test key) is allowlisted by its
# OWN BYTES rather than by its path, so a different private key committed to the
# same file still fails.
#
# If this gate fails on a new finding, remove the secret and rotate it. Adding an
# entry here requires the same triage: name the value, and say why it is not a
# credential.

[extend]
useDefault = true

[allowlist]
description = """
Triaged pre-existing findings. In path order:

1. dis/terraform/docker/cloudbuild-dis-ui-ver2.yaml — _VITE_AUTH0_CLIENT_ID, the
   Auth0 SPA client ID. A public PKCE client has no secret and its client ID is
   inlined into the browser bundle by design (see the Dockerfile build-arg
   comment). A public identifier, not a credential.

2. connectors/clover-oauth/tests/unit/test_vault.py — a fabricated refresh-token
   string asserted against an in-memory vault. No provider ever issued it.

3. cm-frontend/archive/**.tsx — a React `key:` prop matched by the generic
   heuristic. The file was deleted as archived dead code but remains in history,
   so a history scan keeps re-finding it.

4. contracts/pack/fixtures/**.json — objects whose field is literally named
   "key" (funnel-stage identifiers like "lead_to_qualified"). Benign vocabulary.

5. dis/scripts/jwt/gen_dis_jwt_90d*.sh — the header comment explaining that the
   generated tokens are DEV-STUB, HS256-signed with the published constant the
   dis-ui-server verifier checks. The match is the explanation, not a token; the
   generated tokens/ output directory is git-ignored.

The regex below pins TEST_RSA_PRIVATE_KEY_PEM in dis-testing: a throwaway RSA key
committed on purpose so the shared fixtures library can sign test JWTs offline
(issuer customer-master.local, audience dis). It authenticates nothing that
exists. Allowlisted by its own bytes, NOT by its path.
"""
paths = [
  '''dis/terraform/docker/cloudbuild-dis-ui-ver2\.yaml''',
  '''connectors/clover-oauth/tests/unit/test_vault\.py''',
  '''cm-frontend/archive/.*\.tsx''',
  '''contracts/pack/fixtures/.*\.json''',
  '''dis/scripts/jwt/gen_dis_jwt_90d(_v1)?\.sh''',
]
regexes = [
  '''7FpLZXaIE5bLoPrfX7fUQLJN7/tO''',
]
