[project]
name = "dis-ui-server"
version = "0.0.0"
description = "DIS UI backend-for-frontend: FastAPI service exposing the tenant-scoped UI API (sources, stores, mapping templates, CSV uploads, runs, quarantine, canonical reads, connector onboarding/health, audit, mapping suggestions) plus /healthz (DB-free liveness) and /readyz (proves a tenant-scoped dis-rls session opens). The verified JWT is the SOLE source of tenant_id (require_tenant / require_ops), and all Postgres access goes through per-tenant dis-rls sessions."
requires-python = ">=3.12"
dependencies = [
  # DisError root + auth-seam errors, UUIDv7 (readiness probe tenant),
  # trace_id contextvar (envelope), structured logging.
  "dis-core",
  # The ONLY Postgres path: create_rls_engine + the per-tenant rls_session,
  # inheriting the current_database()=='ithina_dis_db'
  # + NOBYPASSRLS target guard (DIS database, never Customer Master).
  "dis-rls",
  # HTTP surface; handlers are thin APIRouters mounted by main.py.
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  # JWT verification: Auth0 RS256 via JWKS, plus the dev-stub HS256 verifier.
  "pyjwt[crypto]>=2.8",
  # Async engine plumbing + the declarative Base. Executes only
  # through the dis-rls session — never a second engine.
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary]>=3.2",
  # Request/response models (FastAPI serializes them directly).
  "pydantic>=2.9",
  # The mapping_rules contract (SourceMapping is BOTH the
  # create/edit validator and the wire type — one model, no drift).
  "dis-mapping",
  # The canonical event models the field catalog derives from.
  "dis-canonical",
  # mapping_produced_columns — the drift-guarded provenance
  # partition shared by the catalog AND the create/edit semantic gate.
  "dis-validation",
  # enrichment_fields(CURRENT_POSITION) — the value-guaranteed columns
  # (currency) the create gate + catalog subtract from the mandatory-to-map set.
  # Pure lib; the consumer imports it too (no purity contract governs the
  # service->lib edge). Used for the set only, never for runtime enrichment I/O.
  "dis-enrichment",
  # The canonical GCS object path + the object write for the
  # synchronous CSV upload — the ONLY sanctioned GCS path.
  "dis-storage",
  # Fire-and-forget audit emission for the upload receiver;
  # the Postgres writer rides the same dis-rls engine.
  "dis-audit",
  # csv.received publish (emulator-guarded publisher).
  "google-cloud-pubsub>=2.23",
  # The streaming multipart push parser for the 10 MB mid-stream
  # ceiling (upload_stream.py) — never Starlette's buffering request.form().
  "python-multipart>=0.0.18",
  # The blocking GCS/Pub/Sub clients run off the event loop via
  # anyio.to_thread. Declared explicitly —
  # imported directly, never ridden transitively off starlette.
  "anyio>=4",
  # Mapping-suggestion endpoint: the google-genai client in VERTEX AI mode
  # (vertexai=True, project+location, ADC from the Cloud Run service account; no API
  # key). The import is lazy (only the LLM path needs it); with no Vertex config the
  # endpoint uses the mechanical fallback. The blocking call runs off the loop via
  # anyio.to_thread, the same pattern as the GCS/Pub/Sub clients above.
  "google-genai>=1.75.0",
  # ADC + optional SA impersonation for the Vertex calls (google.auth.default +
  # impersonated_credentials). Imported DIRECTLY now (not just transitively off
  # google-genai), so declared explicitly.
  "google-auth>=2.53",
  # Fast JSON encode/decode for keyset-cursor pagination (pagination.py).
  "orjson>=3.10",
  # Square OAuth client + Secret Manager token vault, shared with the connector.
  # SDK-free, so this adds no connector service graph to the BFF.
  "thalamus-square-oauth",
  # The same for Clover (handlers/connectors_clover.py). Also SDK-free.
  # DECLARING IT IS WHAT PUTS IT IN THE IMAGE. `uv sync --package dis-ui-server` installs
  # only this package's closure, so an import with no declaration builds green and dies at
  # container start with ModuleNotFoundError.
  "thalamus-clover-oauth",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dis_ui_server"]
