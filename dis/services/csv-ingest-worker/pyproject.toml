[project]
name = "csv-ingest-worker"
version = "0.0.0"
description = "DIS CSV upload ingest worker: consumes csv.received from dis-ui-server, trusts the event's resolved UUID identity, reads (never mints) trace_id, runs the DuckDB structural preflight, wires the dis-pii fail-loud gate, writes one metadata-only bronze row via dis-rls, and publishes ingress.ready after bronze lands. No identity resolution, no mapping/canonical writes."
requires-python = ">=3.12"
dependencies = [
  # DisError root (CsvIngestError family), UUIDv7, trace_id read, timestamps, logging.
  "dis-core",
  # The bronze write goes through the RLS-aware session,
  # inheriting the current_database()=='ithina_dis_db' + NOBYPASSRLS target guard.
  "dis-rls",
  # The fail-loud PII gate — wired, not extended.
  "dis-pii",
  # GCS object read + split_object_uri/parse_object_path.
  "dis-storage",
  # Fire-and-forget audit to Cloud SQL audit.events.
  "dis-audit",
  # Structural preflight. Behaviour-sensitive: contained in preflight.py
  # with canary tests asserting the relied-on sniff behaviour.
  "duckdb>=1.0",
  # csv.received subscriber + ingress.ready publisher (emulator-or-ambient).
  "google-cloud-pubsub>=2.23",
  # The toggled readiness-healthz server: RUN_HEALTH_SERVER=true ->
  # /healthz alongside the pull loop (Cloud Run Service mode); off -> pure loop.
  "uvicorn>=0.32",
  # Async engine + connection for the bronze write (psycopg v3 async).
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary]>=3.2",
  # Typed envelope models (csv.received in, ingress.ready out).
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csv_ingest_worker"]
