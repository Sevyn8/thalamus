[project]
name = "ithina-dis"
version = "0.0.0"
description = "DIS — Data Integration System for the Ithina Data Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # HTTP services / clients
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",

  # Postgres
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",

  # Validation engine (decisions.md D4a)
  "pandera[polars]>=0.20",
  "polars>=1.0",
  "pyarrow>=17",

  # CSV / SQL preview (decisions.md D16)
  "duckdb>=1.0",

  # GCP clients
  "google-cloud-pubsub>=2.23",
  "google-cloud-storage>=2.18",
  "google-cloud-bigquery>=3.25",
  "google-cloud-kms>=3.1",
  "google-cloud-secret-manager>=2.20",
  "google-cloud-logging>=3.10",

  # Auth (Customer Master JWT verification)
  "pyjwt[crypto]>=2.8",

  # Pydantic + config
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",

  # BigQuery models (decisions.md D23)
  "dbt-bigquery>=1.8,<1.10",

  # IDs (UUIDv7)
  "uuid-utils>=0.9",

  # Retry / reliability
  "tenacity>=9",

  # Fast JSON
  "orjson>=3.10",

  # Tracing (trace_id propagation per architecture.md)
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-gcp-trace>=1.7",

  # Structured logging (matches Customer Master)
  "python-json-logger>=2.0,<4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff==0.15.15",
  "mypy==1.19.1",  # pinned EXACT: gate version; if a mypy pre-commit hook is ever added, pin it identically and bump both together (the ruff-skew lesson)
  "faker>=30",
  "pyyaml>=6.0",
  "types-pyyaml",
  "types-jsonschema",  # jsonschema stubs for the mypy gate (slice-9d)
  "jsonschema>=4.23",

  # Workspace members. The root is a virtual project (package = false), so members
  # are not installed unless something in a synced group depends on them. Listing
  # them in the default dev group means `uv sync` / `uv run` install them editable.
  "dis-core",
  "dis-testing",
  "dis-canonical",
  "dis-rls",
  "dis-pii",
  "dis-storage",
  "dis-audit",
  "dis-quarantine",
  "dis-enrichment",
  "dis-mapping",
  "dis-validation",
  "mirror-sync-consumer",
  "csv-ingest-worker",
  "streaming-consumer",
  "dis-ui-server",
  # Synapse — the analytics + actions plane. A PEER of dis/ (separate deploy and
  # lifecycle), joined to this workspace so it resolves dis-canonical + dis-rls as
  # workspace members rather than vendoring either.
  "thalamus-synapse",

  # Connectors (repo-root siblings) join the workspace so uv sync installs them
  # editable alongside the dis packages they reuse.
  "thalamus-connector-sdk",
  "thalamus-square",
  # Square OAuth + Secret Manager token vault (S2), shared by the BFF and the
  # connector runtime. SDK-free so the BFF can depend on it without the connector graph.
  "thalamus-square-oauth",
  # Clover OAuth + Secret Manager token vault (C1), the Square analog for the Clover lane.
  "thalamus-clover-oauth",
  # C2: the Clover connector itself (adapter + puller + mapping).
  "thalamus-clover",

  # Import-graph contracts (slice-05): forbidden imports between the pure
  # pipeline libs and the I/O-bearing libs. Run via `make lint` (lint-imports).
  "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "TID"]

[tool.ruff.lint.isort]
# First-party DIS packages so imports group as stdlib / third-party / first-party
# (root CLAUDE.md import convention).
known-first-party = [
  "dis_core",
  "dis_testing",
  "dis_audit",
  "dis_canonical",
  "dis_enrichment",
  "dis_mapping",
  "dis_quarantine",
  "dis_pii",
  "dis_rls",
  "dis_storage",
  "dis_validation",
  "mirror_sync_consumer",
  "csv_ingest_worker",
  "streaming_consumer",
  "dis_ui_server",
  "thalamus_connector_sdk",
  "thalamus_square",
  "thalamus_square_oauth",
  "thalamus_clover_oauth",
  "thalamus_clover",
  "synapse",
]

[tool.mypy]
# mypy --strict gate (slice-9d): ENFORCING from day one over the Makefile's
# MYPY_PACKAGES list, which only ever grows — a package is added in the same
# commit that clears it. Invocation is per-package (`make mypy`) because
# identically-named test modules across libs (test dirs have no __init__.py,
# by design — see pytest importlib mode below) cannot share one mypy run; the
# Makefile list IS the explicit files list.
# The exclude is the structural boundary: services/dis-ui is TypeScript and
# separately owned; a stray .py there must never be collected by this gate.
# mypy itself is pinned EXACT in [dependency-groups] (the ruff-skew lesson).
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
exclude = "^services/dis-ui/"

[[tool.mypy.overrides]]
# The google-cloud namespace packages (pubsub, storage) ship no py.typed mypy
# can use; standard resolution, scoped to the namespace — not a blanket ignore.
module = "google.cloud.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# google-api-core exceptions (NotFound, used by the square-oauth Secret Manager
# adapter) are untyped; scope the ignore to the namespace, not a blanket ignore.
module = "google.api_core.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Unit tests live next to code (libs/<name>/tests); integration/e2e in repo-root tests/.
# importlib mode lets identically-named test files coexist across libs without
# __init__.py juggling.
testpaths = ["tests", "libs", "services"]
addopts = "--import-mode=importlib"
markers = [
  "integration: requires the local docker-compose stack (Postgres + fakes + emulators)",
]

# Import-graph contracts (slice-05): the two pure pipeline libs must not import
# each other, the I/O-bearing DIS libs, or any DB/GCP client. The import graph
# alone cannot prove the absence of runtime I/O — that is additionally held by
# the no-I/O contract test (tests/contract/) plus review.
[tool.importlinter]
root_packages = [
  "dis_enrichment",
  "dis_mapping",
  "dis_validation",
  "thalamus_connector_sdk",
  "thalamus_square",
  "synapse",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "dis-mapping is pure: no sibling pipeline lib, no I/O-bearing lib, no DB/GCP client"
type = "forbidden"
source_modules = ["dis_mapping"]
forbidden_modules = [
  "dis_enrichment",
  "dis_validation",
  "dis_canonical",
  "dis_rls",
  "dis_pii",
  "dis_storage",
  "dis_audit",
  "dis_quarantine",
  "dis_testing",
  "sqlalchemy",
  "psycopg",
  "google",
  "httpx",
  "redis",
]

[[tool.importlinter.contracts]]
name = "dis-validation is pure: no sibling pipeline lib, no I/O-bearing lib, no DB/GCP client"
type = "forbidden"
source_modules = ["dis_validation"]
forbidden_modules = [
  "dis_enrichment",
  "dis_mapping",
  "dis_rls",
  "dis_pii",
  "dis_storage",
  "dis_audit",
  "dis_quarantine",
  "dis_testing",
  "sqlalchemy",
  "psycopg",
  "google",
  "httpx",
  "redis",
]

[[tool.importlinter.contracts]]
name = "dis-enrichment is pure: no sibling pipeline lib, no I/O-bearing lib, no DB/GCP client"
type = "forbidden"
source_modules = ["dis_enrichment"]
forbidden_modules = [
  "dis_mapping",
  "dis_validation",
  "dis_canonical",
  "dis_rls",
  "dis_pii",
  "dis_storage",
  "dis_audit",
  "dis_quarantine",
  "dis_testing",
  "sqlalchemy",
  "psycopg",
  "google",
  "httpx",
  "redis",
]

# Connectors are receivers; the pure pipeline libs (mapping/validation/enrichment) are
# the inherited downstream and must never be reached into from the receiver tier.
[[tool.importlinter.contracts]]
name = "thalamus_connector_sdk must not import the pure pipeline libs"
type = "forbidden"
source_modules = ["thalamus_connector_sdk"]
forbidden_modules = ["dis_mapping", "dis_validation", "dis_enrichment"]

[[tool.importlinter.contracts]]
name = "thalamus_square must not import the pure pipeline libs"
type = "forbidden"
source_modules = ["thalamus_square"]
forbidden_modules = ["dis_mapping", "dis_validation", "dis_enrichment"]

# --- Synapse (D6): resolvers are the ONLY layer that may reach canonical ---
#
# WHAT THESE CONTRACTS ACTUALLY ENFORCE, stated precisely because the obvious reading is
# wrong. The first two constrain synapse.core ONLY. They were previously DESCRIBED, in
# three module docstrings, as forbidding the database trio to "every synapse.* module
# except synapse.resolvers" — which was never what they said, and stopped being harmless
# the moment a third package (synapse.registry) arrived: it would have sat outside the
# enforced set entirely. The docstrings now match the contracts, and the layers contract
# below is what generalises the rule.
#
# They do NOT and CANNOT enforce "only resolvers know a table name": a table name is a
# STRING LITERAL, and an import graph cannot see a string. There is no importable
# canonical ORM to make it an import either — dis-canonical is Pydantic-only ("SQL
# conversion is the consumer's DB layer", its own words) and the single SQLAlchemy model
# lives inside the dis-ui-server SERVICE, which a peer plane must not depend on.
#
# The table-NAME half is enforced by synapse/tests/unit/test_table_name_containment.py,
# which greps for canonical table names outside synapse/resolvers/. That test is THE
# MECHANISM for that half, not a belt.
[[tool.importlinter.contracts]]
name = "synapse: only resolvers may know canonical row shapes"
type = "forbidden"
source_modules = ["synapse.core"]
forbidden_modules = ["dis_canonical"]

[[tool.importlinter.contracts]]
name = "synapse: only resolvers may reach a database"
type = "forbidden"
source_modules = ["synapse.core"]
forbidden_modules = [
  "dis_rls",
  "sqlalchemy",
  "psycopg",
]

# The registry binds resolvers to capability ids, so it MUST import synapse.resolvers and
# therefore pulls dis_canonical / dis_rls / sqlalchemy in transitively. That is inherent,
# not a leak. What must stay true is that the registry does not reach a database ITSELF:
# allow_indirect_imports = true checks DIRECT imports only, which is exactly that
# distinction. sqlalchemy is deliberately NOT in this list — synapse/registry.py names
# AsyncEngine as a parameter type, and the "no statement construction outside resolvers"
# half is the grep test's job (it asserts `from sqlalchemy import ...`, the form that
# brings in select/table/column/text, appears only under synapse/resolvers/).
[[tool.importlinter.contracts]]
name = "synapse: the registry composes resolvers, it does not reach a database itself"
type = "forbidden"
source_modules = ["synapse.registry"]
forbidden_modules = [
  "dis_canonical",
  "dis_rls",
  "psycopg",
]
allow_indirect_imports = true

# The layering, as a contract rather than a paragraph. Higher may import lower, never the
# reverse: the registry composes resolvers, resolvers read canonical and return core types,
# and core stays pure. This is what generalises the two forbidden contracts above — it is
# the reason a fourth Synapse package cannot quietly arrive outside the rule again.
[[tool.importlinter.contracts]]
name = "synapse layers: orchestrator > registry > persistence > resolvers > core"
type = "layers"
layers = [
  # The orchestrator is the only package that DECIDES anything runs. Above registry because it
  # composes resolution, planning and both writers; nothing below may reach up to it, which is
  # what keeps "a resolver cannot trigger a run" a lint failure rather than a review comment.
  "synapse.orchestrator",
  "synapse.registry",
  # synapse.persistence is the only package that WRITES. Above resolvers because a future
  # caller composing "resolve, then record" belongs at the registry level and may reach both,
  # while a resolver must never reach a writer — the layer order is what makes that a lint
  # failure rather than a review comment.
  "synapse.persistence",
  "synapse.resolvers",
  "synapse.core",
]

[tool.uv]
package = false

[tool.uv.workspace]
# Workspace members are declared here as they are built (root CLAUDE.md: "workspace
# members declared in root pyproject.toml once they exist"). Slice 3 adds dis-canonical;
# Slice 4 adds the three data-plane safety libs.
members = [
  "libs/dis-core",
  "libs/dis-testing",
  "libs/dis-canonical",
  "libs/dis-rls",
  "libs/dis-pii",
  "libs/dis-storage",
  "libs/dis-audit",
  "libs/dis-quarantine",
  "libs/dis-enrichment",
  "libs/dis-mapping",
  "libs/dis-validation",
  "services/mirror-sync-consumer",
  "services/csv-ingest-worker",
  "services/streaming-consumer",
  "services/dis-ui-server",
  # Connectors live at the repo root (sibling of dis/); they join this workspace so
  # they resolve the reused dis packages (csv-ingest-worker bronze/publisher, dis-rls,
  # dis-storage, dis-audit) as workspace members.
  "../connectors/sdk",
  "../connectors/thalamus-square",
  "../connectors/square-oauth",
  "../connectors/clover-oauth",
  "../connectors/thalamus-clover",
  # Synapse lives at the repo root, a sibling of dis/ and connectors/ (D1: a peer,
  # not a member of dis/). Same ../-relative form the connectors use.
  "../synapse",
]

[tool.uv.sources]
# Workspace libs resolve from the workspace. dis-testing and dis-canonical both
# depend on dis-core; dis-canonical uses its identifier aliases. The Slice 4 data-plane
# libs each depend on dis-core (dis-pii on dis-core only — no dis-rls, no DB).
dis-core = { workspace = true }
dis-testing = { workspace = true }
dis-canonical = { workspace = true }
dis-rls = { workspace = true }
dis-pii = { workspace = true }
dis-storage = { workspace = true }
dis-audit = { workspace = true }
dis-quarantine = { workspace = true }
dis-enrichment = { workspace = true }
dis-mapping = { workspace = true }
dis-validation = { workspace = true }
mirror-sync-consumer = { workspace = true }
csv-ingest-worker = { workspace = true }
streaming-consumer = { workspace = true }
dis-ui-server = { workspace = true }
thalamus-connector-sdk = { workspace = true }
thalamus-square = { workspace = true }
thalamus-square-oauth = { workspace = true }
thalamus-clover-oauth = { workspace = true }
thalamus-clover = { workspace = true }
thalamus-synapse = { workspace = true }
