# Cloud Build: build + push the dis-ui-ver2 SPA image, correctly and reproducibly.
# Mirrors terraform/docker/cloudbuild-dis-ui.yaml; only the image name (dis-ui-ver2)
# and the build context (services/dis-ui-ver2) differ.
#
# Run from the REPO ROOT:
#   gcloud builds submit --config terraform/docker/cloudbuild-dis-ui-ver2.yaml \
#     --substitutions=SHORT_SHA=<sha>,_STUB_TOKEN_TENANT=<tok>,_STUB_TOKEN_OPS=<tok>,_STUB_TOKEN_TENANT2=<tok> .
#
# The dis-ui-ver2 Dockerfile's COPYs (package.json, pnpm-lock.yaml, then `COPY . .`)
# are CONTEXT-relative, and those files live ONLY at services/dis-ui-ver2 (not the repo
# root). The build context MUST therefore be services/dis-ui-ver2. -f is repo-root-
# relative, and --no-cache guarantees `vite build` recompiles the current source every
# time (a repo-root context or a cached layer can silently bake a stale bundle).
#
# The Vite vars passed here are BUILD-TIME (baked into the static bundle): MODE=real makes
# the UI call dis-ui-server; the two STUB_TOKEN vars are the staging dev-login persona
# tokens (secrets, passed at submit time, never committed).
#
# The dis-ui-server BASE URL is NOT a build arg: it is a RUNTIME env on the Cloud Run
# service (DIS_UI_SERVER_BASE_URL), so the SPA reads the base URL at runtime.

substitutions:
  _REGION: "asia-south1"
  _REPO: "dis-images"
  # Default to real mode (a plain build is never accidentally fixture here).
  # Override only if needed.
  _DIS_UI_SERVER_MODE: "real"
  # Secrets: pass at submit time. Empty default just means the dev-login personas are
  # not pre-filled; it never affects app correctness.
  _STUB_TOKEN_TENANT: ""
  _STUB_TOKEN_OPS: ""
  _STUB_TOKEN_TENANT2: ""
  # Auth0 SPA config (real mode). Public PKCE client; no secret. Pass at submit time.
  _VITE_AUTH0_DOMAIN: ""
  _VITE_AUTH0_CLIENT_ID: ""
  _VITE_AUTH0_AUDIENCE: ""
  # Single login entry point: CM login URL DIS redirects to when it has no session.
  # Pass at submit time; empty default keeps a plain build working.
  _VITE_CM_LOGIN_URL: ""

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Context = services/dis-ui-ver2 (the frontend package root, where the Dockerfile's
  # COPYs resolve). -f is relative to the uploaded source root (/workspace = repo root).
  # --no-cache: force a fresh recompile every build.
  # DOCKER_BUILDKIT=1 is REQUIRED: the Dockerfile uses a `# syntax=` directive and a
  # heredoc `COPY <<NGINX` for the nginx config, which the classic builder cannot parse.
  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - -f
      - terraform/docker/dis-ui-ver2.Dockerfile
      - --no-cache
      - --build-arg
      - VITE_DIS_UI_SERVER_MODE=${_DIS_UI_SERVER_MODE}
      - --build-arg
      - VITE_STUB_TOKEN_TENANT=${_STUB_TOKEN_TENANT}
      - --build-arg
      - VITE_STUB_TOKEN_OPS=${_STUB_TOKEN_OPS}
      - --build-arg
      - VITE_STUB_TOKEN_TENANT2=${_STUB_TOKEN_TENANT2}
      - --build-arg
      - VITE_AUTH0_DOMAIN=${_VITE_AUTH0_DOMAIN}
      - --build-arg
      - VITE_AUTH0_CLIENT_ID=${_VITE_AUTH0_CLIENT_ID}
      - --build-arg
      - VITE_AUTH0_AUDIENCE=${_VITE_AUTH0_AUDIENCE}
      - --build-arg
      - VITE_CM_LOGIN_URL=${_VITE_CM_LOGIN_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dis-ui-ver2:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dis-ui-ver2:latest
      - services/dis-ui-ver2

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dis-ui-ver2:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dis-ui-ver2:latest
