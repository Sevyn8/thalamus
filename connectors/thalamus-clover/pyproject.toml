[project]
name = "thalamus-clover"
version = "0.0.0"
description = "Thalamus Clover connector: implements the thalamus_connector_sdk adapter against the Clover API (sandbox). Per-tenant OAuth via thalamus-clover-oauth, Items + Categories + ItemStocks to a Clover-specific snapshot CSV. Feeds the existing DIS pipeline via Path A (CSV into bronze)."
requires-python = ">=3.12"
dependencies = [
  # The adapter Protocol, ConnectorPipeline, trigger, reason codes, CSV serialize.
  "thalamus-connector-sdk",
  # DisError root, timestamps, logging.
  "dis-core",
  # Clover API client (sandbox + production share the same shapes).
  "httpx>=0.27",
  # C1: the Secret Manager OAuth token vault + Clover OAuth client. CloverTokenStore
  # supplies the access token AND the merchant id (every Clover path is merchant-scoped).
  "thalamus-clover-oauth",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thalamus_clover"]
