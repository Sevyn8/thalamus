[project]
name = "thalamus-square"
version = "0.0.0"
description = "Thalamus Square connector: implements the thalamus_connector_sdk adapter against the Square API (sandbox). OAuth per-tenant token, Locations to store resolution, Catalog + Inventory to store_sku_current_position CSV columns, Orders to the sale-event path. Feeds the existing DIS pipeline via Path A (CSV into bronze)."
requires-python = ">=3.12"
dependencies = [
  # The adapter Protocol, ConnectorPipeline, trigger, reason codes, CSV serialize.
  "thalamus-connector-sdk",
  # DisError root, timestamps, logging.
  "dis-core",
  # Canonical field-key names the CSV header targets (drift guard in tests).
  "dis-canonical",
  # Square API client (sandbox + production share the same shapes).
  "httpx>=0.27",
  # S2: the Secret Manager OAuth token vault + Square OAuth client (VaultTokenStore reads
  # and refreshes through it). SDK-free package shared with the BFF.
  "thalamus-square-oauth",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thalamus_square"]
